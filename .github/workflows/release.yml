name: Release
on:
    push:
        tags: ['v*']
permissions:
    contents: read
jobs:
    verify:
        uses: ./.github/workflows/ci.yml
    publish:
        needs: verify
        runs-on: macos-latest
        timeout-minutes: 15
        permissions:
            contents: write
        outputs:
            version: ${{ steps.release.outputs.version }}
            checksum: ${{ steps.release.outputs.checksum }}
        steps:
            - uses: actions/checkout@v4
            - uses: jdx/mise-action@v2
            - run: npm ci --ignore-scripts
            - run: npm run release
            - id: release
              name: Publish verified release assets
              env:
                  GH_TOKEN: ${{ github.token }}
              run: node scripts/release.ts publish
    formula:
        needs: publish
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
            - uses: jdx/mise-action@v2
            - name: Update default branch Formula
              env:
                  GH_TOKEN: ${{ github.token }}
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
                  RELEASE_VERSION: ${{ needs.publish.outputs.version }}
                  RELEASE_CHECKSUM: ${{ needs.publish.outputs.checksum }}
              run: node scripts/release.ts update-formula "$RELEASE_VERSION" "$RELEASE_CHECKSUM"
